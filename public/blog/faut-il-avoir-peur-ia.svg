      <g fill="#818cf8">
        <circle cx="100" cy="38" r="11"/><circle cx="35" cy="72" r="11"/><circle cx="165" cy="72" r="11"/>
        <circle cx="40" cy="175" r="11"/><circle cx="160" cy="175" r="11"/><circle cx="100" cy="222" r="11"/>
      </g>
