<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Repero AI LinkedIn introduction — centered composition</title>
  <desc id="desc">French founder introduction visual. The current official Repero AI wordmark is placed unchanged as the footer signature.</desc>
  <rect width="1200" height="1200" fill="#050A1C"/>
  <rect x="56" y="56" width="1088" height="1088" rx="56" fill="#0B1531" stroke="#334155" stroke-width="2"/>
  <rect x="568" y="164" width="64" height="4" rx="2" fill="#22D3EE"/>
  <g fill="#F1F5F9" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="58" font-weight="700" letter-spacing="-2.6" text-anchor="middle">
    <text x="600" y="332">Avec l’IA,</text>
    <text x="600" y="426">le plus difficile n’est pas</text>
    <text x="600" y="520">toujours d’obtenir une réponse.</text>
    <text x="600" y="680">C’est de ne pas perdre le fil.</text>
  </g>
  <rect x="112" y="820" width="976" height="2" rx="1" fill="#334155"/>
  <image x="300" y="648" width="600" height="600" href="repero-wordmark-white-cyan.png" xlink:href="repero-wordmark-white-cyan.png"/>
  <text x="600" y="1080" fill="#94A3B8" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="26" font-weight="500" letter-spacing="-.5" text-anchor="middle">repero.ai</text>
</svg>
